<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 12px; min-width: 280px; max-width: 420px; background: #1a0000; color: #ff2a2a; font: 14px sans-serif; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 4px; color: #cc2222; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; }
    select, input { accent-color: #ff2a2a; background: #260000; color: #ff2a2a; border: 1px solid #600000; font: inherit; }
    input[type=range] { width: 140px; }
    input[type=text], input[type=number] { width: 150px; }
    input[type=number].small { width: 70px; }
    #status { padding: 6px 8px; border: 1px solid #600000; border-radius: 4px; margin-bottom: 4px; }
    .hint { font-size: 12px; color: #aa2020; margin: 4px 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="status"></div>

  <h2>Filter</h2>
  <label>Mode
    <select id="mode">
      <option value="luma">Luma red</option>
      <option value="strict">Strict red</option>
    </select>
  </label>
  <label>Dim <input type="range" id="dim" min="0.05" max="1" step="0.01"></label>

  <h2>When</h2>
  <label>Turn on
    <select id="activation">
      <option value="manual">Manually</option>
      <option value="times">At set times</option>
      <option value="sun">Sunset to sunrise</option>
    </select>
  </label>

  <div data-show="manual">
    <label>Enabled <input type="checkbox" id="enabled"></label>
  </div>

  <div data-show="times">
    <label>Start (evening) <input type="time" id="startTime"></label>
    <label>Stop (morning) <input type="time" id="endTime"></label>
  </div>

  <div data-show="sun">
    <label>City
      <input type="text" id="city" list="cities" placeholder="Search a city" autocomplete="off">
    </label>
    <datalist id="cities"></datalist>
    <label>Latitude <input type="number" id="lat" step="0.01" min="-90" max="90"></label>
    <label>Longitude <input type="number" id="lon" step="0.01" min="-180" max="180"></label>
    <label>Minutes after sunset <input type="number" class="small" id="sunStartOffset" step="5" min="-180" max="180"></label>
    <label>Minutes after sunrise <input type="number" class="small" id="sunEndOffset" step="5" min="-180" max="180"></label>
    <div class="hint" id="sunInfo"></div>
  </div>

  <h2>Extras</h2>
  <label>Filter dialogs and popovers <input type="checkbox" id="filterDialogs"></label>
  <label id="themeRow">Recolor Firefox toolbar (desktop) <input type="checkbox" id="themeBrowser"></label>

  <script src="lib/suncalc.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
